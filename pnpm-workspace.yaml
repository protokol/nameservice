packages:
    - packages/*

allowBuilds:
    "@parcel/watcher": false
    argon2: false
    bcrypto: true
    better-sqlite3: true
    bstring: false
    ngrok: false
    nsfw: false
    protobufjs: false
    tiny-secp256k1: false
    unrs-resolver: false

overrides:
    better-sqlite3: ^13.0.0
    "@arkecosystem/core": 3.13.0
    "@arkecosystem/core-api": 3.13.0
    "@arkecosystem/core-blockchain": 3.13.0
    "@arkecosystem/core-cli": 3.13.0
    "@arkecosystem/core-database": 3.13.0
    "@arkecosystem/core-forger": 3.13.0
    "@arkecosystem/core-kernel": 3.13.0
    "@arkecosystem/core-logger-pino": 3.13.0
    "@arkecosystem/core-magistrate-api": 3.13.0
    "@arkecosystem/core-magistrate-crypto": 3.13.0
    "@arkecosystem/core-magistrate-transactions": 3.13.0
    "@arkecosystem/core-p2p": 3.13.0
    "@arkecosystem/core-snapshots": 3.13.0
    "@arkecosystem/core-state": 3.13.0
    "@arkecosystem/core-test-framework": 3.13.0
    "@arkecosystem/core-transaction-pool": 3.13.0
    "@arkecosystem/core-transactions": 3.13.0
    "@arkecosystem/core-webhooks": 3.13.0
    "@arkecosystem/crypto": 3.13.0
    joi: 17.13.7
    pg: 8.23.0

packageExtensions:
    "bcrypto@*":
        dependencies:
            node-gyp: latest
    "better-sqlite3@*":
        dependencies:
            node-gyp: latest
    "@arkecosystem/core-kernel@*":
        dependencies:
            "@arkecosystem/core-api": latest
            "@arkecosystem/core-blockchain": latest
            "@arkecosystem/core-database": latest
            "@arkecosystem/core-forger": latest
            "@arkecosystem/core-logger-pino": latest
            "@arkecosystem/core-magistrate-api": latest
            "@arkecosystem/core-magistrate-transactions": latest
            "@arkecosystem/core-p2p": latest
            "@arkecosystem/core-snapshots": latest
            "@arkecosystem/core-state": latest
            "@arkecosystem/core-transaction-pool": latest
            "@arkecosystem/core-transactions": latest
            "@arkecosystem/core-webhooks": latest
            "@protokol/nameservice-api": "workspace:*"
            "@protokol/nameservice-transactions": "workspace:*"
    "@arkecosystem/core-magistrate-api@*":
        dependencies:
            "@arkecosystem/crypto": latest
    "@arkecosystem/core-snapshots@*":
        dependencies:
            joi: latest
    "@arkecosystem/core-transaction-pool@*":
        dependencies:
            "@arkecosystem/core-magistrate-crypto": latest
    "@arkecosystem/core@*":
        dependencies:
            "@oclif/errors": latest
    "@arkecosystem/crypto@*":
        dependencies:
            "@types/node": latest
    "@types/eslint-plugin-prettier@*":
        dependencies:
            eslint: latest
    jest-circus@*:
        dependencies:
            slash: 3.0.0
    jest-util@*:
        dependencies:
            jest-runner: latest
    node-fetch@*:
        dependencies:
            domexception: latest
    pg-cursor@*:
        dependencies:
            pg: latest
    typeorm@*:
        dependencies:
            pg: latest
            pg-query-stream: latest
