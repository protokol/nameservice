services:
    postgres:
        image: "postgres:18-alpine"
        container_name: ark-testnet-postgres
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - "postgres:/var/lib/postgresql"
        environment:
            POSTGRES_PASSWORD: password
            POSTGRES_DB: ark_testnet
            POSTGRES_USER: ark

volumes:
    postgres:
